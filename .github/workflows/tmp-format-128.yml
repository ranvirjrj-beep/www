name: Temporary format issue 128

on:
  push:
    branches:
      - tmp/format-128

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/components/CostCalculator.tsx --write
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CostCalculator.tsx
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "chore: format cost calculator"
            git push
          fi
